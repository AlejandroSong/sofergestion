<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOFER Gestión — Entrando</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        background: #f7f9fc;
        color: #0a2e6d;
        font-size: 15px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <p>Entrando con Google…</p>
    <script>
      (function () {
        var TOKEN_KEY = 'sofer-google-id-token';
        var ERROR_KEY = 'sofer-google-id-error';
        var APP_CALLBACK = 'es.sofergestion.app://google-callback';
        var params = new URLSearchParams(window.location.hash.replace(/^#/, ''));
        if (!params.get('id_token') && !params.get('error')) {
          params = new URLSearchParams(window.location.search);
        }
        var idToken = params.get('id_token');
        var error = params.get('error_description') || params.get('error');
        try {
          if (idToken) {
            sessionStorage.setItem(TOKEN_KEY, idToken);
            localStorage.setItem(TOKEN_KEY, idToken);
          }
          if (error) {
            sessionStorage.setItem(ERROR_KEY, error);
            localStorage.setItem(ERROR_KEY, error);
          }
        } catch (e) {}
        if (window.opener) {
          try {
            window.opener.postMessage(
              { type: 'sofer-google-id-token', idToken: idToken, error: error },
              window.location.origin
            );
          } catch (e) {}
          window.close();
          return;
        }
        var ua = navigator.userAgent || '';
        var cap = window.Capacitor;
        var inAppWebView =
          (cap &&
            ((cap.isNativePlatform && cap.isNativePlatform()) ||
              (cap.getPlatform && cap.getPlatform() !== 'web'))) ||
          (/Android/i.test(ua) && (/;\s*wv\)/i.test(ua) || /SOFERGestion/i.test(ua)));
        if (inAppWebView) {
          window.location.replace(window.location.origin + '/');
          return;
        }
        var q = [];
        if (idToken) q.push('id_token=' + encodeURIComponent(idToken));
        if (error) q.push('error=' + encodeURIComponent(error));
        window.location.replace(APP_CALLBACK + (q.length ? '?' + q.join('&') : ''));
      })();
    </script>
  </body>
</html>
