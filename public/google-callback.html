<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>SOFER Gestión — Google</title>
  </head>
  <body>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.hash.replace(/^#/, ''));
        if (!params.get('id_token') && !params.get('error')) {
          params = new URLSearchParams(window.location.search);
        }
        var idToken = params.get('id_token');
        var error = params.get('error_description') || params.get('error');
        var payload = {
          type: 'sofer-google-id-token',
          idToken: idToken,
          error: error,
        };
        try {
          if (idToken) sessionStorage.setItem('sofer-google-id-token', idToken);
          if (error) sessionStorage.setItem('sofer-google-id-error', error);
        } catch (e) {}
        if (window.opener) {
          window.opener.postMessage(payload, window.location.origin);
          window.close();
          return;
        }
        var appCallback = 'es.sofergestion.app://google-callback';
        var fragment = window.location.hash;
        if (!fragment && (idToken || error)) {
          fragment = '#' + (idToken ? 'id_token=' + encodeURIComponent(idToken) : 'error=' + encodeURIComponent(error));
        }
        window.location.replace(appCallback + fragment);
        setTimeout(function () {
          window.location.replace(window.location.origin + '/');
        }, 400);

      })();
    </script>
  </body>
</html>
